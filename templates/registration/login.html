{% extends 'base.html' %}

{% block title %}로그인 - Luna{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
    <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">로그인</h2>

    {% if form.errors %}
        <div class="p-3 mb-4 text-sm text-red-600 bg-red-50 rounded-lg border border-red-200">
            아이디 또는 비밀번호가 올바르지 않습니다.
        </div>
    {% endif %}

    <form method="post" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}

        {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
        {% endif %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">아이디</label>
            <input type="text" name="username" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">비밀번호</label>
            <input type="password" name="password" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <button type="submit" 
                class="w-full py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition">
            로그인
        </button>
    </form>
</div>
{% endblock %}
