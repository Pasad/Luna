{% extends 'base.html' %}

{% block title %}{% if album %}사진 수정{% else %}사진 등록{% endif %} - Luna{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
    <h2 class="text-xl font-bold text-gray-900 mb-6">
        {% if album %}사진 수정{% else %}새 사진 등록{% endif %}
    </h2>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        {% if album %}
        <!-- 수정 시 기존 이미지 미리보기 -->
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">현재 이미지</label>
            <div class="aspect-video w-48 rounded-lg overflow-hidden border border-gray-200 bg-gray-50">
                <img src="{{ album.image_url }}" class="w-full h-full object-cover">
            </div>
        </div>
        {% endif %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                {% if album %}변경할 사진 (선택 사항){% else %}사진 파일{% endif %}
            </label>
            <input type="file" name="image" accept="image/*" {% if not album %}required{% endif %}
                   class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">장소</label>
            <input type="text" name="location" value="{{ album.location|default:'' }}" placeholder="예: 토산 포구"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">설명</label>
            <textarea name="caption" rows="4" placeholder="사진에 대한 설명을 입력하세요"
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">{{ album.caption|default:'' }}</textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2">
            <a href="{% url 'albums:list' %}" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">취소</a>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 text-sm">
                {% if album %}수정 완료{% else %}업로드{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
