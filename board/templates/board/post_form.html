{% extends 'base.html' %}

{% block title %}{% if post %}게시글 수정{% else %}새 게시글 작성{% endif %} - Luna{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
    <h2 class="text-xl font-bold text-gray-900 mb-6">
        {% if post %}게시글 수정{% else %}새 게시글 작성{% endif %}
    </h2>

    <form method="post" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">제목</label>
            <input type="text" name="title" value="{{ post.title|default:'' }}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">내용</label>
            <textarea name="content" rows="10" required
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">{{ post.content|default:'' }}</textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
            <a href="{% url 'board:list' %}" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 text-sm">취소</a>
            <button type="submit" class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 text-sm">
                {% if post %}수정 완료{% else %}등록하기{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
